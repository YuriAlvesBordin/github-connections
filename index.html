<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Interactive graph of GitHub user connections" />
  <title>GitHub Connections · Graph View</title>
  <link rel="preconnect" href="https://avatars.githubusercontent.com" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/ui.css" />
</head>
<body>
  <a href="#canvas" class="skip-link">Skip to graph</a>

  <canvas id="canvas" aria-label="GitHub connections graph" tabindex="0"></canvas>

  <header id="topbar" class="topbar">
    <div class="topbar-group">
      <input id="username-input" type="text" placeholder="github username" autocomplete="off" spellcheck="false" />
      <button id="btn-load" class="btn btn-primary btn-icon" type="button" title="load user" aria-label="load user">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10" cy="7" r="4"/>
          <path d="M2 17c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </button>
      <button id="btn-clear" class="btn btn-icon" type="button" title="clear graph" aria-label="clear graph">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h14M8 6V4h4v2M5 6l1 11h8l1-11"/>
        </svg>
      </button>
    </div>
    <div class="topbar-group">
      <button id="btn-fit" class="btn btn-icon" type="button" title="fit to view (F)" aria-label="fit to view">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/>
        </svg>
      </button>
      <button id="btn-shuffle" class="btn btn-icon" type="button" title="re-heat simulation" aria-label="reheat simulation">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4l12 12M16 4L4 16"/>
          <circle cx="10" cy="10" r="3"/>
        </svg>
      </button>
    </div>
  </header>

  <aside id="filter-panel" class="filter-panel" aria-label="Connection filters">
    <div class="filter-title">connections</div>
    <div class="filter-row">
      <button class="filter-chip active" data-filter="all">all</button>
      <button class="filter-chip" data-filter="mutual">mutual</button>
      <button class="filter-chip" data-filter="oneway">one-way</button>
    </div>
    <label class="filter-toggle">
      <input type="checkbox" id="filter-arrows" checked />
      <span>show arrows on one-way edges</span>
    </label>
    <label class="filter-toggle">
      <input type="checkbox" id="filter-labels" checked />
      <span>show labels</span>
    </label>
    <div class="filter-legend">
      <div class="legend-item"><span class="legend-dot legend-mutual"></span>mutual follow</div>
      <div class="legend-item"><span class="legend-dot legend-oneway"></span>one-way follow</div>
      <div class="legend-item"><span class="legend-dot legend-repo"></span>top repos</div>
    </div>
    <div class="filter-hint">tap = open · hold = expand · double-tap = repos</div>
  </aside>

  <aside id="info-panel" class="info-panel" aria-label="Selected node info">
    <div class="info-header">
      <img id="info-avatar" class="info-avatar" alt="" />
      <div class="info-identity">
        <h3 id="info-title">-</h3>
        <a id="info-link" class="info-link" href="#" target="_blank" rel="noreferrer noopener">view on github ↗</a>
      </div>
    </div>
    <div id="info-sub" class="info-sub">-</div>
    <p id="info-desc" class="info-desc"></p>
    <div class="info-stats">
      <div class="info-stat">
        <div class="info-stat-value" id="info-mutual">0</div>
        <div class="info-stat-label">mutual</div>
      </div>
      <div class="info-stat">
        <div class="info-stat-value" id="info-oneway">0</div>
        <div class="info-stat-label">one-way</div>
      </div>
      <div class="info-stat">
        <div class="info-stat-value" id="info-total">0</div>
        <div class="info-stat-label">total</div>
      </div>
    </div>
    <button id="btn-expand" class="btn btn-primary btn-block" type="button">expand connections</button>
    <button id="btn-repos" class="btn btn-block" type="button">show top repos</button>
  </aside>

  <div id="ctx-menu" class="ctx-menu" role="menu">
    <div class="ctx-item" id="ctx-expand" role="menuitem">expand connections</div>
    <div class="ctx-item" id="ctx-focus" role="menuitem">focus & center</div>
    <div class="ctx-item" id="ctx-open" role="menuitem">open on github ↗</div>
    <div class="ctx-separator"></div>
    <div class="ctx-item danger" id="ctx-delete" role="menuitem">remove node</div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="rate-limit-bar"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
